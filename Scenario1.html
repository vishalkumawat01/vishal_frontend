
<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h2>My To-Do List</h2>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a task">
            <button id="addBtn">Add</button>
        </div>

        <ul id="taskList"></ul>

        <p id="remaining"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
